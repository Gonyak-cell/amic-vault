[project]
name = "amic-vault-ingestion"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "chardet>=5,<6",
  "extract-msg>=0.55,<0.56",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.24,<2",
  "pypdfium2>=4.30,<5",
  "pypdf>=5,<7",
  "pyhwp==0.1b15",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "python-pptx>=1.0,<2",
  "RTFDE>=0.1.2,<0.2",
  "six>=1.16,<2",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "reportlab>=4,<5"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.parsers", "app.converters", "app.security", "app.synthesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
