{
  "global": { "scrape_interval": "15s", "scrape_timeout": "10s", "evaluation_interval": "15s" },
  "alerting": {
    "alertmanagers": [
      { "scheme": "http", "static_configs": [{ "targets": ["alertmanager:9093"] }] }
    ]
  },
  "rule_files": ["/etc/prometheus/alerts.yml"],
  "scrape_configs": [
    {
      "job_name": "amic-vault-api",
      "metrics_path": "/metrics",
      "scheme": "http",
      "static_configs": [{ "targets": ["api:3001"] }]
    }
  ],
  "storage": { "tsdb": { "retention": { "time": "15d", "size": "1GB" } } }
}
