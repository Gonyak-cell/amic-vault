name: amic-vault-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amic_vault}
      POSTGRES_USER: ${POSTGRES_USER:-amic_vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amic_vault_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-amic-vault-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-amic-vault-minio-dev-password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-amic-vault-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-amic-vault-minio-dev-password}
      S3_BUCKET: ${S3_BUCKET:-amic-vault-dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --with-lock --ignore-existing "local/$${S3_BUCKET}"
        mc version enable "local/$${S3_BUCKET}"
        mc retention set --default governance 1d "local/$${S3_BUCKET}"
        mc retention clear --default "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        tail -f /dev/null
    healthcheck:
      test: ['CMD-SHELL', 'mc ls local/$${S3_BUCKET} >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: 'no'

  clamav:
    build:
      context: ..
      dockerfile: infra/clamav.Dockerfile
    platform: linux/amd64
    command: ['sh', '-lc', 'freshclam --foreground --stdout && unset CLAMAV_NO_CLAMD && exec /init']
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 25M
      CLAMD_CONF_ReadTimeout: 5
      CLAMD_CONF_CommandReadTimeout: 5
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan -p1 >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30

  ingestion:
    build:
      context: ..
      dockerfile: workers/ingestion/Dockerfile
    environment:
      PYTHONUNBUFFERED: '1'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      CLAMAV_TIMEOUT_SECONDS: '5'
      CLAMAV_MAX_BYTES: '26214400'
      CLAMAV_MAX_SIGNATURE_AGE_SECONDS: '604800'
      NODE_ENV: development
      INGESTION_WORKER_IDENTITY_PROFILE: loopback-dev
      INGESTION_GATEWAY_MTLS_ENABLED: 'false'
      INGESTION_GATEWAY_SANITIZES_IDENTITY_HEADERS: 'false'
      INGESTION_GATEWAY_DIRECT_WORKER_ACCESS: loopback-only
      INGESTION_GATEWAY_WORKLOAD_SUBJECT: amic-vault-api
      INGESTION_GATEWAY_AUDIENCE: amic-vault-ingestion
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - '127.0.0.1:${INGESTION_WORKER_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PROCESS_ROLE: api
      DATABASE_MIGRATION_URL: ''
      DATABASE_URL: ''
      DATABASE_RUNTIME_URL: postgres://vault_app:vault_app_dev_password@postgres:5432/amic_vault
      DATABASE_RUNTIME_ROLE: vault_app
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-amic-vault-dev}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-amic-vault-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-amic-vault-minio-dev-password}
      INGESTION_WORKER_URL: http://ingestion:8000
      INGESTION_WORKER_IDENTITY_PROFILE: loopback-dev
      WORKER_BASE_URL: http://ingestion:8000
      AI_PREP_ENABLED: ${AI_PREP_ENABLED:-false}
      LOCAL_GEMMA_ENABLED: ${LOCAL_GEMMA_ENABLED:-false}
    ports:
      - '${API_PORT:-3001}:3001'

  api-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PROCESS_ROLE: worker
      DATABASE_MIGRATION_URL: ''
      DATABASE_URL: ''
      DATABASE_RUNTIME_URL: postgres://vault_app:vault_app_dev_password@postgres:5432/amic_vault
      DATABASE_RUNTIME_ROLE: vault_app
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-amic-vault-dev}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-amic-vault-minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-amic-vault-minio-dev-password}
      INGESTION_WORKER_URL: http://ingestion:8000
      INGESTION_WORKER_IDENTITY_PROFILE: loopback-dev
      WORKER_BASE_URL: http://ingestion:8000
      AI_PREP_ENABLED: ${AI_PREP_ENABLED:-false}
      LOCAL_GEMMA_ENABLED: ${LOCAL_GEMMA_ENABLED:-false}

volumes:
  postgres-data:
  minio-data:
