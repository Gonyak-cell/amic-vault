{
  "services": {
    "web": {
      "build": null,
      "image": "${VAULT_WEB_IMAGE:?set VAULT_WEB_IMAGE to an immutable name@sha256 digest}"
    },
    "api": {
      "build": null,
      "image": "${VAULT_API_IMAGE:?set VAULT_API_IMAGE to an immutable name@sha256 digest}"
    },
    "api-worker": {
      "build": null,
      "image": "${VAULT_API_IMAGE:?set VAULT_API_IMAGE to an immutable name@sha256 digest}"
    },
    "ingestion-gateway": {
      "image": "docker.io/library/nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46"
    },
    "ingestion": {
      "build": null,
      "image": "${VAULT_INGESTION_IMAGE:?set VAULT_INGESTION_IMAGE to an immutable name@sha256 digest}",
      "depends_on": {
        "clamav": {
          "condition": "service_healthy"
        }
      }
    },
    "clamav": {
      "build": null,
      "image": "clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4"
    }
  }
}
