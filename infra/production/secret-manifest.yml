      "providerReferenceClass": "host-or-provider-mounted-file-path",
      "classification": "confidential",
      "owner": "storage-platform",
      "ownerUid": 10003,
      "mode": "0400",
      "maximumBytes": 1024,
      "rotationDays": 90,
      "overlapMinutes": 15,
      "revocationAction": "restart-api-and-worker",
