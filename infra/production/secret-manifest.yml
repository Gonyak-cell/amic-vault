{
  "schemaVersion": "amic-vault.sf20-production-secrets.v1",
  "mountRoot": "/run/secrets",
  "rotationReceiptContract": {
    "schemaVersion": "amic-vault.sf20-secret-rotation-receipt.v1",
    "slots": ["current", "next"],
    "referenceIdsAreOpaque": true,
    "valuesForbidden": true,
    "requiredFields": [
      "secretId",
      "currentReferenceId",
      "nextReferenceId",
      "overlapStartsAt",
      "overlapEndsAt",
      "currentVerified",
      "nextVerified",
      "revokedReferenceIds"
    ],
    "cutoverRequires": [
      "current-present",
      "next-present",
      "both-verified",
      "inside-declared-overlap",
      "current-not-revoked",
      "next-not-revoked"
    ],
    "postCutover": "old-reference-must-be-revoked-and-removed"
  },
  "secrets": [
    {
      "id": "database-runtime-url",
      "composeSecret": "database_runtime_url",
      "sourceFileVariable": "DATABASE_RUNTIME_URL_SECRET_FILE",
      "containerPath": "/run/secrets/database_runtime_url",
      "providerReferenceClass": "host-or-provider-mounted-file-path",
      "classification": "confidential",
      "owner": "database-platform",
      "ownerUid": 10003,
      "mode": "0400",
      "maximumBytes": 4096,
      "rotationDays": 90,
      "overlapMinutes": 15,
      "revocationAction": "restart-api-and-worker",
      "consumers": [
        {
          "service": "api",
          "runtimeFileVariable": "DATABASE_RUNTIME_URL_FILE"
        },
        {
          "service": "api-worker",
          "runtimeFileVariable": "DATABASE_RUNTIME_URL_FILE"
        }
      ]
    },
    {
      "id": "api-storage-access-key-id",
      "composeSecret": "s3_api_access_key_id",
      "sourceFileVariable": "S3_API_ACCESS_KEY_ID_SECRET_FILE",
