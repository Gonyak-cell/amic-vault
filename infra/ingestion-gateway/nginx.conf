user nginx;
pid /tmp/nginx.pid;
worker_processes 1;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 512m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream ingestion_backend {
        server ingestion:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name ingestion-gateway;

        ssl_certificate /run/secrets/ingestion_gateway_server_cert;
        ssl_certificate_key /run/secrets/ingestion_gateway_server_key;
        ssl_client_certificate /run/secrets/ingestion_gateway_ca;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        if ($ssl_client_s_dn != "CN=amic-vault-api") {
            return 403;
        }

        location / {
            proxy_pass http://ingestion_backend;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 65s;
            proxy_read_timeout 65s;

            proxy_set_header Host ingestion;
            proxy_set_header Connection "";
            proxy_set_header X-Amic-Dev-Loopback-Identity "";
            proxy_set_header X-Amic-Gateway-Mtls-Verified "true";
            proxy_set_header X-Amic-Gateway-Workload-Subject "amic-vault-api";
            proxy_set_header X-Amic-Gateway-Audience "amic-vault-ingestion";
        }
    }
}
