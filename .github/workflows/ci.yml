name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vitest run tools/evalset/local-ai-eval.spec.ts
      - run: node --test tools/quality/check-telemetry-policy.spec.mjs
      - run: node tools/quality/check-telemetry-policy.mjs
      - run: node --test tools/quality/check-small-firm-profile.spec.mjs tools/bench/small-firm-20-profile.spec.mjs
      - run: node tools/quality/check-small-firm-profile.mjs --static
      - run: node tools/bench/small-firm-20-profile.mjs
      - name: Verify SF20 monitoring contracts with official tools
        run: |
          node --test tools/monitoring/check-small-firm-monitoring.spec.mjs
          node tools/monitoring/check-small-firm-monitoring.mjs
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/monitoring:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/infra/monitoring:/etc/prometheus:ro" \
            docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            test rules /etc/prometheus/alerts.test.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/infra/monitoring:/etc/alertmanager:ro" \
            docker.io/prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Verify SF20 production and recovery contracts
        run: |
          node --test \
            tools/security/check-production-profile.spec.mjs \
            tools/security/check-production-host.spec.mjs \
            tools/security/check-production-secrets.spec.mjs \
            tools/release/build-backup-set-manifest.spec.mjs \
            tools/release/backup-restore-drill.spec.mjs \
            tools/release/check-sf20-residency.spec.mjs \
            tools/release/small-firm-rollback-drill.spec.mjs
      - run: pnpm check:production-ui-literals
      - run: pnpm ui:production-smoke
      - run: pnpm check:ui-pr-checklist
      - run: pnpm build
      - run: pnpm backlog:validate
      - run: pnpm dlp:corpus:check
      - run: pnpm launch:readiness
      - run: pnpm launch:execution
      - run: pnpm release:uat
      - run: pnpm release:prod-preflight
      - run: pnpm outlook:deployment:check
      - run: pnpm outlook:verification:check
      - run: pnpm outlook:redaction:check
      - run: pnpm outlook:operational:check -- --target pr --mode advisory
      - run: node infra/ci/scripts/check-docs-package-frozen.mjs
      - run: node tools/db/check-migration-conventions.mjs

  db-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_MIGRATION_URL: postgres://amic_vault:amic_vault_dev_password@localhost:5432/amic_vault
      DATABASE_RUNTIME_URL: postgres://vault_app:vault_app_dev_password@localhost:5432/amic_vault
      DATABASE_RUNTIME_ROLE: vault_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/docker-compose.dev.yml up -d --wait postgres minio minio-init ingestion
      - run: node tools/db/check-migration-conventions.mjs
      - run: pnpm db:migrate
      - run: pnpm db:rollback
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:integration -- audit-immutability
      - run: pnpm test:integration -- cross-tenant
      - run: pnpm test:integration -- fail-closed
      - run: pnpm test:integration -- permission-matrix
      - run: pnpm test:integration -- search-filter
      - run: pnpm test:integration -- search-permission
      - run: pnpm test:integration -- metadata-leakage
      - run: pnpm test:integration
      - run: docker compose -f infra/docker-compose.dev.yml down -v
        if: always()

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t amic-vault-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t amic-vault-web:${{ github.sha }} .
      - name: Build ingestion image
        run: docker build -f workers/ingestion/Dockerfile -t amic-vault-ingestion:${{ github.sha }} .

  python-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.15'
          enable-cache: false
      - name: Install LibreOffice for legacy Office extraction tests
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: python --version
      - run: uv --version | grep -Eq '^uv 0\.11\.15( \(|$)'
      - run: uv sync --frozen --all-extras --no-editable
        working-directory: workers/ingestion
      - run: uv run --frozen pytest tests
        working-directory: workers/ingestion
