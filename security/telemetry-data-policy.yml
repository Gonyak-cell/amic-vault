{
  "schemaVersion": "amic-vault.telemetry-data-policy.v1",
  "allowedAttributeKeys": [
    "service",
    "operation",
    "route",
    "result",
    "error_class",
    "queue",
    "parser_state",
    "security_state",
    "http_method",
    "http_status",
    "duration_bucket",
    "retry_count",
    "worker_role",
    "code"
  ],
  "forbiddenIdentifierKeys": [
    "tenant_id",
    "user_id",
    "document_id",
    "matter_id",
    "file_id",
    "version_id",
    "email_id",
    "node_id",
    "storage_uri",
    "filename",
    "query",
    "snippet",
    "body",
    "prompt",
    "token"
  ],
  "limits": {
    "maxAttributes": 8,
    "maxStringLength": 96,
    "maxValuesPerKey": 64
  },
  "canaryTokens": [
    "__TEL_CANARY_RAW_TENANT_ID__",
    "__TEL_CANARY_DOCUMENT_BODY__",
    "__TEL_CANARY_BEARER_TOKEN__"
  ],
  "scanner": {
    "roots": ["apps/api/src", "workers/ingestion"],
    "extensions": [".ts", ".py"],
    "excludedSuffixes": [".spec.ts", ".test.ts"]
  },
